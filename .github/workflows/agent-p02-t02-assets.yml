name: Agent P02-T02 Assets
on:
  push:
    branches: [agent/p01-t01-visual-foundation]
permissions:
  contents: write
jobs:
  assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GALLERY_SOURCE_COMMIT: 66ee33fc04ff3789e227c1f5fc388ca11860b29b
      GOOGLE_FONTS_COMMIT: 352f6b7d9d6cc4fa9e242b931291d31b21a6dc84
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Location task scope
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node docs/implementation-workflow/cli/design-workflow.mjs context --json > /tmp/context.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(c.stage?.number!==10||c.tasks?.current?.id!=='P02-T02'||c.policy?.codeEdits!=='allowed-with-current-task-scope') throw new Error('P02-T02 is not the active Stage 10 task.');
          NODE
      - name: Import pinned responsive map artwork
        run: |
          set -euo pipefail
          mkdir -p frontend/src/assets/map
          BASE="https://raw.githubusercontent.com/vanzasetia/art-gallery-website/${GALLERY_SOURCE_COMMIT}/images"
          curl -fsSL --retry 3 "${BASE}/desktop/image-map@2x.png" -o frontend/src/assets/map/desktop.png
          curl -fsSL --retry 3 "${BASE}/tablet/image-map@2x.png" -o frontend/src/assets/map/tablet.png
          curl -fsSL --retry 3 "${BASE}/mobile/image-map@2x.png" -o frontend/src/assets/map/mobile.png
          file frontend/src/assets/map/*.png
          test -s frontend/src/assets/map/desktop.png
          test -s frontend/src/assets/map/tablet.png
          test -s frontend/src/assets/map/mobile.png
      - name: Repair and extend asset provenance
        run: |
          cat > frontend/src/assets/SOURCES.md <<EOF
          # Visual asset sources

          Production visual assets are committed locally; runtime rendering does not depend on the source URLs below.

          ## Typography
          - Big Shoulders Display variable font: Google Fonts repository commit \`${GOOGLE_FONTS_COMMIT}\`, \`ofl/bigshouldersdisplay/BigShouldersDisplay[wght].ttf\`.
          - Outfit variable font: Google Fonts repository commit \`${GOOGLE_FONTS_COMMIT}\`, \`ofl/outfit/Outfit[wght].ttf\`.
          - Corresponding SIL Open Font License files are committed beside each font.
          - Approved roles use Big Shoulders Display 800/900 and Outfit 300.

          ## Gallery, map, and brand artwork
          - Local raster/SVG copies come from the Modern Art Gallery challenge asset snapshot \`vanzasetia/art-gallery-website\` at commit \`${GALLERY_SOURCE_COMMIT}\`, cross-checked against the approved Figma \`🤖 Workflow\` resources.
          - Gallery raster assets retain desktop, tablet, and mobile art-direction variants.
          - Location map artwork retains the pinned \`images/{desktop,tablet,mobile}/image-map@2x.png\` variants under \`src/assets/map/\` so the approved crops do not depend on a live map service.
          - Brand artwork includes the approved logo, navigation arrows, marker, and social SVGs.

          ## Image semantics
          - Informative images must receive concise purpose-based alternative text where rendered.
          - Decorative images must use an empty \`alt\` value and must not duplicate nearby text.
          - Static map artwork is decorative when the same location information is present semantically in the adjacent \`<address>\` content.
          - Prefer Astro's local image pipeline so intrinsic dimensions and optimized output remain explicit.
          EOF
      - name: Commit assets and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-p02-t02-assets.yml
          git add frontend/src/assets/map frontend/src/assets/SOURCES.md
          git commit -m "feat: add responsive Location map assets"
          git push origin HEAD:agent/p01-t01-visual-foundation
