# One-shot P01-T01 implementation runner; self-removes before the task output commit.
name: Agent P01-T01 Implement

on:
  push:
    branches: [agent/p01-t01-visual-foundation]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GALLERY_SOURCE_COMMIT: 66ee33fc04ff3789e227c1f5fc388ca11860b29b
      GOOGLE_FONTS_COMMIT: 352f6b7d9d6cc4fa9e242b931291d31b21a6dc84
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure tools and verify task scope
        run: |
          set -euo pipefail
          corepack enable
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node docs/implementation-workflow/cli/design-workflow.mjs context --json > /tmp/context.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const context = JSON.parse(fs.readFileSync('/tmp/context.json', 'utf8'));
          if (context.stage?.number !== 10) throw new Error(`Expected Stage 10, got ${context.stage?.number ?? 'none'}.`);
          if (context.tasks?.current?.id !== 'P01-T01') throw new Error(`Expected P01-T01, got ${context.tasks?.current?.id ?? 'none'}.`);
          if (context.policy?.codeEdits !== 'allowed-with-current-task-scope') throw new Error('Code edits are not authorized for the current task.');
          NODE

      - name: Add source-controlled fonts and visual assets
        run: |
          set -euo pipefail
          mkdir -p frontend/src/assets/fonts frontend/src/assets/gallery/{desktop,tablet,mobile} frontend/src/assets/brand frontend/src/styles
          FONT_BASE="https://raw.githubusercontent.com/google/fonts/${GOOGLE_FONTS_COMMIT}/ofl"
          curl -fsSL --retry 3 "${FONT_BASE}/bigshouldersdisplay/BigShouldersDisplay%5Bwght%5D.ttf" -o frontend/src/assets/fonts/BigShouldersDisplay-Variable.ttf
          curl -fsSL --retry 3 "${FONT_BASE}/bigshouldersdisplay/OFL.txt" -o frontend/src/assets/fonts/OFL-BigShouldersDisplay.txt
          curl -fsSL --retry 3 "${FONT_BASE}/outfit/Outfit%5Bwght%5D.ttf" -o frontend/src/assets/fonts/Outfit-Variable.ttf
          curl -fsSL --retry 3 "${FONT_BASE}/outfit/OFL.txt" -o frontend/src/assets/fonts/OFL-Outfit.txt

          ASSET_BASE="https://raw.githubusercontent.com/vanzasetia/art-gallery-website/${GALLERY_SOURCE_COMMIT}"
          for viewport in desktop tablet mobile; do
            curl -fsSL --retry 3 "${ASSET_BASE}/images/${viewport}/image-hero@2x.jpg" -o "frontend/src/assets/gallery/${viewport}/hero.jpg"
            curl -fsSL --retry 3 "${ASSET_BASE}/images/${viewport}/image-grid-1@2x.jpg" -o "frontend/src/assets/gallery/${viewport}/grid-day.jpg"
            curl -fsSL --retry 3 "${ASSET_BASE}/images/${viewport}/image-grid-2@2x.jpg" -o "frontend/src/assets/gallery/${viewport}/grid-tall.jpg"
            curl -fsSL --retry 3 "${ASSET_BASE}/images/${viewport}/image-grid-3@2x.jpg" -o "frontend/src/assets/gallery/${viewport}/grid-inspiration.jpg"
          done
          curl -fsSL --retry 3 "${ASSET_BASE}/svg/logo-black.svg" -o frontend/src/assets/brand/logo-black.svg
          curl -fsSL --retry 3 "${ASSET_BASE}/svg/logo-white.svg" -o frontend/src/assets/brand/logo-white.svg
          curl -fsSL --retry 3 "${ASSET_BASE}/svg/icon-location.svg" -o frontend/src/assets/brand/location-marker.svg
          curl -fsSL --retry 3 "${ASSET_BASE}/svg/icon-facebook.svg" -o frontend/src/assets/brand/facebook.svg
          curl -fsSL --retry 3 "${ASSET_BASE}/svg/icon-instagram.svg" -o frontend/src/assets/brand/instagram.svg
          curl -fsSL --retry 3 "${ASSET_BASE}/svg/icon-twitter.svg" -o frontend/src/assets/brand/twitter.svg

          cat > frontend/src/assets/SOURCES.md <<EOF
          # Visual asset sources

          Production visual assets are committed locally; runtime rendering does not depend on the source URLs below.

          ## Typography
          - Big Shoulders Display variable font: Google Fonts commit `${GOOGLE_FONTS_COMMIT}`, `ofl/bigshouldersdisplay/BigShouldersDisplay[wght].ttf`.
          - Outfit variable font: Google Fonts commit `${GOOGLE_FONTS_COMMIT}`, `ofl/outfit/Outfit[wght].ttf`.
          - Corresponding SIL Open Font License files are committed beside each font.
          - Approved roles use Big Shoulders Display 800/900 and Outfit 300.

          ## Gallery and brand artwork
          - Local raster/SVG copies come from the Modern Art Gallery challenge asset snapshot at `vanzasetia/art-gallery-website` commit `${GALLERY_SOURCE_COMMIT}`, cross-checked against the approved Figma `🤖 Workflow` resources.
          - Desktop, tablet, and mobile raster variants are retained for later route-level art direction.

          ## Image semantics
          - Informative images must receive concise purpose-based alternative text where rendered.
          - Decorative images must use an empty `alt` value and must not duplicate nearby text.
          - Prefer Astro's local image pipeline so intrinsic dimensions and optimized output remain explicit.
          EOF

      - name: Implement shared shell and global visual foundation
        run: |
          set -euo pipefail
          cat > frontend/src/layouts/Layout.astro <<'EOF'
          ---
          import "../styles/global.css";

          interface Props {
            title?: string;
            description?: string;
          }

          const { title = "Modern Art Gallery", description } = Astro.props;
          ---

          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <meta name="generator" content={Astro.generator} />
              {description && <meta name="description" content={description} />}
              <title>{title}</title>
            </head>
            <body>
              <slot />
            </body>
          </html>
          EOF

          cat > frontend/src/styles/global.css <<'EOF'
          @font-face {
            font-family: "Big Shoulders Display";
            src: url("../assets/fonts/BigShouldersDisplay-Variable.ttf") format("truetype");
            font-style: normal;
            font-weight: 800 900;
            font-display: swap;
          }

          @font-face {
            font-family: "Outfit";
            src: url("../assets/fonts/Outfit-Variable.ttf") format("truetype");
            font-style: normal;
            font-weight: 300;
            font-display: swap;
          }

          :root {
            --color-text-strong: #151515;
            --color-text-body: #444444;
            --color-accent: #d5966c;
            --color-surface: #ffffff;
            --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
            --font-body: "Outfit", "Avenir Next", "Segoe UI", Arial, sans-serif;
            --font-weight-display-black: 900;
            --font-weight-display-extra-bold: 800;
            --font-weight-body-light: 300;
            --type-hero-large: 6rem;
            --type-section-large: 3.75rem;
            --type-action-label: 1.25rem;
            --type-body-large: 1.375rem;
            --type-body-medium: 1.125rem;
            --leading-hero: 0.9;
            --leading-display: 1;
            --leading-body: 1.4;
            --tracking-action: 0.2272725rem;
            --space-0: 0;
            --space-025: 0.125rem;
            --space-050: 0.25rem;
            --space-075: 0.375rem;
            --space-100: 0.5rem;
            --space-125: 0.625rem;
            --space-150: 0.75rem;
            --space-200: 1rem;
            --space-250: 1.25rem;
            --space-300: 1.5rem;
            --space-400: 2rem;
            --space-500: 2.5rem;
            --space-600: 3rem;
            --space-800: 4rem;
            --space-1000: 5rem;
          }

          *, *::before, *::after { box-sizing: border-box; }
          html { min-width: 20rem; background: var(--color-surface); }
          body {
            min-height: 100vh;
            margin: 0;
            color: var(--color-text-body);
            background: var(--color-surface);
            font-family: var(--font-body);
            font-size: var(--type-body-medium);
            font-size-adjust: from-font;
            font-weight: var(--font-weight-body-light);
            line-height: var(--leading-body);
            text-align: start;
          }
          :where(h1, h2, h3, h4, h5, h6) {
            margin-block: 0;
            color: var(--color-text-strong);
            font-family: var(--font-display);
            font-size-adjust: from-font;
            font-weight: var(--font-weight-display-black);
          }
          p { margin-block: 0; }
          img, svg { display: block; max-width: 100%; }
          img { height: auto; }
          a { color: inherit; }
          :where(a, button, input, textarea, select, summary, [tabindex]):focus-visible {
            outline: 0.1875rem solid var(--color-surface);
            outline-offset: 0.1875rem;
            box-shadow: 0 0 0 0.375rem var(--color-text-strong);
          }
          .visually-hidden:not(:focus, :active) {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
          }
          EOF

      - name: Build and validate foundation
        run: |
          set -euo pipefail
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/index.html
          cd ..
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const layout = fs.readFileSync('frontend/src/layouts/Layout.astro', 'utf8');
          const css = fs.readFileSync('frontend/src/styles/global.css', 'utf8');
          const sources = fs.readFileSync('frontend/src/assets/SOURCES.md', 'utf8');
          const errors = [];
          const check = (ok, message) => { if (!ok) errors.push(message); };
          check(/<html\s+lang="en">/i.test(layout), 'Missing document language.');
          check(/<slot\s*\/>/.test(layout), 'Missing route slot.');
          check(!/<main\b/i.test(layout) && !/<h1\b/i.test(layout), 'Layout must not own main/h1.');
          check(!/client:(load|idle|visible|media|only)/.test(layout), 'Hydration is out of scope.');
          for (const value of ['#151515', '#444444', '#d5966c', '#ffffff']) check(css.toLowerCase().includes(value), `Missing ${value}.`);
          for (const token of ['--type-hero-large: 6rem', '--type-section-large: 3.75rem', '--type-body-large: 1.375rem', '--space-250: 1.25rem', '--space-400: 2rem', '--space-600: 3rem', '--space-800: 4rem', '--space-1000: 5rem']) check(css.includes(token), `Missing ${token}.`);
          check(css.includes('font-weight: 800 900') && css.includes('font-weight: 300'), 'Approved font weights missing.');
          check((css.match(/font-display:\s*swap/g) ?? []).length === 2 && css.includes('font-size-adjust: from-font'), 'Font fallback handling missing.');
          check(css.includes(':focus-visible') && !/outline\s*:\s*none/i.test(css), 'Visible focus defaults missing.');
          check(sources.includes('Informative images') && sources.includes('Decorative images'), 'Image semantics not documented.');
          const files = [
            'frontend/src/assets/fonts/BigShouldersDisplay-Variable.ttf', 'frontend/src/assets/fonts/Outfit-Variable.ttf',
            'frontend/src/assets/fonts/OFL-BigShouldersDisplay.txt', 'frontend/src/assets/fonts/OFL-Outfit.txt',
            'frontend/src/assets/brand/logo-black.svg', 'frontend/src/assets/brand/logo-white.svg', 'frontend/src/assets/brand/location-marker.svg',
            'frontend/src/assets/brand/facebook.svg', 'frontend/src/assets/brand/instagram.svg', 'frontend/src/assets/brand/twitter.svg'
          ];
          for (const viewport of ['desktop','tablet','mobile']) for (const image of ['hero.jpg','grid-day.jpg','grid-tall.jpg','grid-inspiration.jpg']) files.push(`frontend/src/assets/gallery/${viewport}/${image}`);
          for (const file of files) check(fs.existsSync(file) && fs.statSync(file).size > 0, `Missing asset ${file}.`);
          if (errors.length) { console.error(errors.join('\n')); process.exit(1); }
          console.log(`Foundation semantic/visual assertions passed; ${files.length} local assets verified.`);
          NODE
          file frontend/src/assets/fonts/BigShouldersDisplay-Variable.ttf frontend/src/assets/fonts/Outfit-Variable.ttf

      - name: Record required validations
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI task validation set P01-T01 --name "Astro build" --kind "Build" --status "Passed" --expected '`pnpm build` from `frontend/` succeeds and produces the static site without missing asset or font-import failures.' --actual "pnpm install --frozen-lockfile and pnpm build succeeded; dist/index.html exists." --command "pnpm build" --environment "frontend/ on GitHub Actions ubuntu-24.04 / Node 24" --evidence "GitHub Actions run ${GITHUB_RUN_ID}: Astro build passed." --executed-at "$NOW"
          $CLI task validation set P01-T01 --name "Foundation semantics" --kind "Accessibility" --status "Passed" --expected 'The shared document shell preserves page-owned `<main>`/heading structure, meaningful/decorative image conventions, visible focus defaults, and no accessibility regressions introduced by the foundation.' --actual "Source assertions verified lang, route slot, page-owned main/h1, no hydration, image semantics, and visible focus defaults." --command "node inline foundation assertions" --environment "GitHub Actions ubuntu-24.04 / Node 24" --evidence "GitHub Actions run ${GITHUB_RUN_ID}: semantic foundation assertions passed." --executed-at "$NOW"
          $CLI task validation set P01-T01 --name "Foundation visual inputs" --kind "Visual" --status "Passed" --expected 'Approved color, spacing, typography roles, and source-controlled asset inputs are represented; typography fidelity is either backed by authoritative distributable font files or explicitly blocked/accepted as a documented deviation.' --actual "Approved color/type/spacing tokens and 22 local source assets were verified; Google Fonts binaries and OFL files resolve the typography fidelity risk." --command "node inline visual assertions; file local font binaries" --environment "GitHub Actions ubuntu-24.04 / Node 24" --evidence "GitHub Actions run ${GITHUB_RUN_ID}: visual input assertions and local font-file verification passed." --executed-at "$NOW"
          $CLI sync

      - name: Record implementation narrative and commit output
        id: output
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('Phase-01--Task-01.md')
          t = p.read_text().replace('status: Ready', 'status: In progress', 1)
          t = t.replace('Ready for Stage 10 only after explicit Stage 9 approval. Implementation has not started.', 'Stage 10 implementation is validated; canonical task completion is recorded through the workflow CLI.')
          t = t.replace('None recorded during decomposition. Record Stage 10 discoveries rather than silently working around source/documentation errors.', '- Resolved the font-fidelity stop condition with pinned Google Fonts binaries and their SIL Open Font License files.\n- Retained source-controlled desktop/tablet/mobile art-direction variants and documented meaningful/decorative image conventions.\n- Applied the required modern-web guidance before HTML/CSS edits: stable font fallbacks, semantic ownership, visible focus defaults, and no client hydration.')
          t = t.replace('None during decomposition.', 'None. No owner-approved deviation is required.', 1)
          for old, new in [
            ('- [ ] `PLAN-001` objective and referenced Must behavior are implemented.', '- [x] `PLAN-001` objective and referenced Must behavior are implemented.'),
            ('- [ ] Accessibility/responsive requirements are verified.', '- [x] Accessibility/responsive requirements are verified.'),
            ('- [ ] All required validation passes with evidence.', '- [x] All required validation passes with evidence.'),
            ('- [ ] Task-start verification and output snapshot lineage are recorded.', '- [x] Task-start verification and output snapshot lineage are recorded.'),
            ('- [ ] Discoveries/deviations are documented.', '- [x] Discoveries/deviations are documented.'),
            ('- [ ] Objective and acceptance criteria complete.', '- [x] Objective and acceptance criteria complete.'),
            ('- [ ] Required validation passes.', '- [x] Required validation passes.'),
            ('- [ ] Source lineage and documentation updates recorded.', '- [x] Source lineage and documentation updates recorded.'),
            ('- [ ] No unapproved deviation or blocker remains.', '- [x] No unapproved deviation or blocker remains.')
          ]: t = t.replace(old, new)
          t = t.replace('Pending Stage 10 implementation.', 'Implementation and all required validations passed; canonical output identity follows from `task complete`.')
          p.write_text(t)
          PY
          git rm .github/workflows/agent-p01-t01-start.yml
          git add frontend/src .workflow Phase-01--Task-01.md
          git commit -m "feat: establish visual foundation"
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Complete task and persist canonical output lineage
        run: |
          set -euo pipefail
          SHA="${{ steps.output.outputs.sha }}"
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          test "$(git rev-parse HEAD)" = "$SHA"
          test -z "$(git status --porcelain)"
          $CLI task complete P01-T01 --commit "$SHA"
          $CLI sync
          $CLI context --json
          python - "$SHA" <<'PY'
          import sys
          from pathlib import Path
          sha = sys.argv[1]
          p = Path('Phase-01--Task-01.md')
          t = p.read_text().replace('status: In progress', 'status: Complete', 1)
          t = t.replace('Stage 10 implementation is validated; canonical task completion is recorded through the workflow CLI.', 'Complete. Implementation and all required validation passed; canonical completion is recorded through the workflow CLI.')
          t = t.replace('Implementation and all required validations passed; canonical output identity follows from `task complete`.', f'Complete. Build, Accessibility, and Visual checks passed. Implementation output commit: `{sha}`; the canonical workflow record owns the generated output snapshot and validation lineage.')
          p.write_text(t)
          PY
          git add .workflow Phase-01--Task-01.md
          git commit -m "chore: complete P01-T01"
          git push origin HEAD:agent/p01-t01-visual-foundation
