name: Agent P02-T01 Runtime
on:
  push:
    branches: [agent/p01-t01-visual-foundation]
permissions:
  contents: read
jobs:
  runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Home
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Measure nine viewports
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 - <<'PY'
          from pathlib import Path
          html=Path('frontend/dist/index.html').read_text()
          script=r'''<script>
          (()=>{const measure=()=>{const rect=s=>{const n=document.querySelector(s);if(!n)return null;const x=n.getBoundingClientRect();return{x:x.x,y:x.y,width:x.width,height:x.height}};const h=document.querySelector('[data-home-title]');const p=h?getComputedStyle(h,'::before'):null;const v={width:innerWidth,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,h1Count:document.querySelectorAll('h1').length,h2Count:document.querySelectorAll('h2').length,actionHref:document.querySelector('a.primary-action')?.getAttribute('href'),hero:rect('[data-home-hero]'),heroImage:rect('.home-hero__image'),title:rect('[data-home-title]'),intro:rect('[data-home-intro]'),gallery:rect('[data-gallery-content]'),footer:rect('[data-home-footer] footer'),pseudoDisplay:p?.display,pseudoClip:p?.clipPath};document.body.dataset.homeValidation=encodeURIComponent(JSON.stringify(v))};measure();setTimeout(measure,500);setTimeout(measure,1500)})();
          </script>'''
          Path('frontend/dist/home-validation.html').write_text(html.replace('</body>',script+'</body>'))
          PY
          python3 -m http.server 4321 --directory frontend/dist >/tmp/home-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep .5
          for width in 1440 1276 1072 900 768 640 630 480 375; do
            profile="/tmp/chrome-${width}"
            rm -rf "$profile"
            "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --user-data-dir="$profile" --window-size="${width},1000" --virtual-time-budget=2200 --dump-dom http://127.0.0.1:4321/home-validation.html > "/tmp/home-${width}.html" 2>"/tmp/chrome-${width}.log"
            grep -q 'data-home-validation=' "/tmp/home-${width}.html" || { echo "Missing payload at ${width}"; tail -50 "/tmp/home-${width}.html"; cat "/tmp/chrome-${width}.log"; exit 1; }
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const requested=[1440,1276,1072,900,768,640,630,480,375];
          const results=requested.map(w=>{const h=fs.readFileSync(`/tmp/home-${w}.html`,'utf8');const x=h.match(/data-home-validation="([^"]+)"/);return JSON.parse(decodeURIComponent(x[1]))});
          const errors=[];const near=(a,b,t=2)=>Math.abs(a-b)<=t;
          for(const r of results){if(r.overflow>1)errors.push(`${r.width}px overflow=${r.overflow}`);if(r.h1Count!==1)errors.push(`${r.width}px h1=${r.h1Count}`);if(r.h2Count!==2)errors.push(`${r.width}px h2=${r.h2Count}`);if(r.actionHref!=='/location/')errors.push(`${r.width}px href=${r.actionHref}`)}
          const d=results.find(r=>r.width===1440);if(!d)errors.push(`actual widths=${results.map(r=>r.width)}`);else{if(!near(d.hero.width,1440)||!near(d.hero.height,800))errors.push(`1440 hero ${JSON.stringify(d.hero)}`);if(!near(d.heroImage.x,451)||!near(d.heroImage.width,540.375)||!near(d.heroImage.height,800))errors.push(`1440 image ${JSON.stringify(d.heroImage)}`);if(!near(d.title.x,165.1)||!near(d.title.y,189))errors.push(`1440 title ${JSON.stringify(d.title)}`);if(!near(d.intro.x,925)||!near(d.intro.y,255)||!near(d.intro.width,350))errors.push(`1440 intro ${JSON.stringify(d.intro)}`);if(!near(d.gallery.x,165)||!near(d.gallery.y,980,3)||!near(d.gallery.width,1110))errors.push(`1440 gallery ${JSON.stringify(d.gallery)}`);if(d.pseudoDisplay==='none'||d.pseudoClip==='none')errors.push('1440 split title inactive')}
          const t=results.find(r=>r.width===768);if(!t)errors.push('missing actual 768');else{if(!near(t.hero.height,700)||!near(t.heroImage.width,437)||!near(t.heroImage.height,700))errors.push(`768 hero ${JSON.stringify(t.hero)} image ${JSON.stringify(t.heroImage)}`);if(!near(t.intro.width,339))errors.push(`768 intro ${t.intro.width}`);if(!near(t.gallery.width,689)||!near(t.gallery.y,820,3))errors.push(`768 gallery ${JSON.stringify(t.gallery)}`);if(t.pseudoDisplay!=='none')errors.push(`768 split display=${t.pseudoDisplay}`)}
          const m=results.find(r=>r.width===375);if(!m)errors.push('missing actual 375');else{if(!near(m.heroImage.width,375)||!near(m.heroImage.height,240))errors.push(`375 image ${JSON.stringify(m.heroImage)}`);if(!near(m.title.x,16)||!near(m.intro.width,343))errors.push(`375 title/intro ${JSON.stringify(m.title)} ${JSON.stringify(m.intro)}`);if(!near(m.gallery.width,343))errors.push(`375 gallery=${m.gallery.width}`);if(!near(m.footer.width,375))errors.push(`375 footer=${m.footer.width}`);if(m.pseudoDisplay!=='none')errors.push(`375 split display=${m.pseudoDisplay}`)}
          console.log(JSON.stringify(results,null,2));if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          NODE
