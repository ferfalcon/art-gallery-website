name: Agent P02-T01 Verify
on:
  push:
    branches: [agent/p01-t01-visual-foundation]
permissions:
  contents: read
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build production Home
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/index.html
          test -z "$(find dist -name '*.js' -type f -print -quit)"
      - name: Validate Home source semantics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const hero = fs.readFileSync('frontend/src/components/HomeHero.astro','utf8');
          const gallery = fs.readFileSync('frontend/src/components/GalleryContent.astro','utf8');
          const page = fs.readFileSync('frontend/src/pages/index.astro','utf8');
          const checks = [
            [(hero.match(/<h1\b/g) ?? []).length === 1, 'one h1'],
            [hero.includes('href="/location/"'), 'explicit /location/ href'],
            [! /client:|onclick|on:click/.test(hero + gallery + page), 'no hydration/client handlers'],
            [hero.includes('clip-path: inset(0 44.5% 0 0)'), 'desktop split title'],
            [(gallery.match(/alt=""/g) ?? []).length === 3, 'decorative gallery images'],
            [(gallery.match(/loading="lazy"/g) ?? []).length === 3, 'gallery lazy loading'],
            [page.includes('<Footer theme="dark"'), 'Dark Footer'],
            [! /overflow-x\s*:\s*hidden/i.test(hero + gallery + page), 'no overflow hiding'],
          ];
          const errors = checks.filter(([ok]) => !ok).map(([,label]) => label);
          if (errors.length) throw new Error(`Home source checks failed: ${errors.join(', ')}`);
          NODE
      - name: Measure rendered Home at anchor and transition widths
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 - <<'PY'
          from pathlib import Path
          source = Path('frontend/dist/index.html').read_text()
          script = r'''<script>
          (async()=>{await document.fonts.ready;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const rect=s=>{const n=document.querySelector(s);if(!n)return null;const x=n.getBoundingClientRect();return{x:x.x,y:x.y,width:x.width,height:x.height}};const h=document.querySelector('[data-home-title]');const p=h?getComputedStyle(h,'::before'):null;const v={width:innerWidth,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,h1Count:document.querySelectorAll('h1').length,h2Count:document.querySelectorAll('h2').length,actionHref:document.querySelector('a.primary-action')?.getAttribute('href'),hero:rect('[data-home-hero]'),heroImage:rect('.home-hero__image'),title:rect('[data-home-title]'),intro:rect('[data-home-intro]'),gallery:rect('[data-gallery-content]'),footer:rect('[data-home-footer] footer'),pseudoDisplay:p?.display,pseudoClip:p?.clipPath};document.body.dataset.homeValidation=encodeURIComponent(JSON.stringify(v))})();
          </script>'''
          Path('frontend/dist/home-validation.html').write_text(source.replace('</body>', script + '</body>'))
          PY
          python3 -m http.server 4321 --directory frontend/dist >/tmp/home-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 0.5
          for width in 1440 1276 1072 900 768 640 630 480 375; do
            "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size="${width},1000" --virtual-time-budget=2500 --dump-dom http://127.0.0.1:4321/home-validation.html > "/tmp/home-${width}.html" 2>/tmp/home-chrome.log
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const widths=[1440,1276,1072,900,768,640,630,480,375];
          const results=widths.map(width=>{const html=fs.readFileSync(`/tmp/home-${width}.html`,'utf8');const m=html.match(/data-home-validation="([^"]+)"/);if(!m)throw new Error(`No runtime payload at ${width}`);return JSON.parse(decodeURIComponent(m[1]));});
          const errors=[]; const near=(a,b,t=2)=>Math.abs(a-b)<=t;
          for(const r of results){if(r.overflow>1)errors.push(`${r.width}px overflow ${r.overflow}`);if(r.h1Count!==1)errors.push(`${r.width}px h1=${r.h1Count}`);if(r.h2Count!==2)errors.push(`${r.width}px h2=${r.h2Count}`);if(r.actionHref!=='/location/')errors.push(`${r.width}px href=${r.actionHref}`)}
          const d=results.find(r=>r.width===1440);if(!d)errors.push('missing 1440 viewport');else{if(!near(d.hero.width,1440)||!near(d.hero.height,800))errors.push(`1440 hero ${JSON.stringify(d.hero)}`);if(!near(d.heroImage.x,451)||!near(d.heroImage.width,540.375)||!near(d.heroImage.height,800))errors.push(`1440 image ${JSON.stringify(d.heroImage)}`);if(!near(d.title.x,165.1)||!near(d.title.y,189))errors.push(`1440 title ${JSON.stringify(d.title)}`);if(!near(d.intro.x,925)||!near(d.intro.y,255)||!near(d.intro.width,350))errors.push(`1440 intro ${JSON.stringify(d.intro)}`);if(!near(d.gallery.x,165)||!near(d.gallery.y,980,3)||!near(d.gallery.width,1110))errors.push(`1440 gallery ${JSON.stringify(d.gallery)}`);if(d.pseudoDisplay==='none'||d.pseudoClip==='none')errors.push('1440 split title inactive')}
          const t=results.find(r=>r.width===768);if(!t)errors.push('missing 768 viewport');else{if(!near(t.hero.height,700)||!near(t.heroImage.width,437)||!near(t.heroImage.height,700))errors.push(`768 hero ${JSON.stringify(t.hero)} image ${JSON.stringify(t.heroImage)}`);if(!near(t.intro.width,339))errors.push(`768 intro ${t.intro.width}`);if(!near(t.gallery.width,689)||!near(t.gallery.y,820,3))errors.push(`768 gallery ${JSON.stringify(t.gallery)}`);if(t.pseudoDisplay!=='none')errors.push(`768 split title display=${t.pseudoDisplay}`)}
          const m=results.find(r=>r.width===375);if(!m)errors.push('missing 375 viewport');else{if(!near(m.heroImage.width,375)||!near(m.heroImage.height,240))errors.push(`375 image ${JSON.stringify(m.heroImage)}`);if(!near(m.title.x,16)||!near(m.intro.width,343))errors.push(`375 title/intro ${JSON.stringify(m.title)} ${JSON.stringify(m.intro)}`);if(!near(m.gallery.width,343))errors.push(`375 gallery ${m.gallery.width}`);if(!near(m.footer.width,375))errors.push(`375 footer ${m.footer.width}`);if(m.pseudoDisplay!=='none')errors.push(`375 split title display=${m.pseudoDisplay}`)}
          console.log(JSON.stringify(results,null,2));if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          NODE
