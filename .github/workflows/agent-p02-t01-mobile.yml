name: Agent P02-T01 Mobile
on:
  push:
    branches: [agent/p01-t01-visual-foundation]
permissions:
  contents: read
jobs:
  mobile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Home
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: Emulate 480px and 375px exactly
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 4321 --directory frontend/dist >/tmp/home-server.log 2>&1 &
          SERVER_PID=$!
          PROFILE=/tmp/home-cdp-profile
          rm -rf "$PROFILE" && mkdir -p "$PROFILE"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --remote-debugging-address=127.0.0.1 --remote-debugging-port=0 --user-data-dir="$PROFILE" about:blank >/tmp/home-cdp.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $SERVER_PID $CHROME_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            [ -s "$PROFILE/DevToolsActivePort" ] && break
            kill -0 "$CHROME_PID" 2>/dev/null || { cat /tmp/home-cdp.log; exit 1; }
            sleep .2
          done
          test -s "$PROFILE/DevToolsActivePort" || { cat /tmp/home-cdp.log; exit 1; }
          export CDP_PORT="$(head -n 1 "$PROFILE/DevToolsActivePort")"
          curl -sf "http://127.0.0.1:${CDP_PORT}/json/version" >/dev/null
          node --input-type=module <<'NODE'
          const port=process.env.CDP_PORT;
          const targets=await (await fetch(`http://127.0.0.1:${port}/json`)).json();
          const target=targets.find(t=>t.type==='page');
          if(!target?.webSocketDebuggerUrl) throw new Error('No page target');
          const ws=new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.addEventListener('open',resolve,{once:true});ws.addEventListener('error',reject,{once:true})});
          let id=0;const pending=new Map();
          ws.addEventListener('message',event=>{const m=JSON.parse(event.data);if(!m.id)return;const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result)});
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}))});
          await send('Page.enable');await send('Runtime.enable');
          const results=[];
          for(const width of [480,375]){
            await send('Emulation.setDeviceMetricsOverride',{width,height:1000,deviceScaleFactor:1,mobile:false});
            await send('Page.navigate',{url:'http://127.0.0.1:4321/'});
            await new Promise(r=>setTimeout(r,250));
            await send('Runtime.evaluate',{expression:'document.fonts.ready',awaitPromise:true});
            const out=await send('Runtime.evaluate',{returnByValue:true,expression:`(()=>{const rect=s=>{const n=document.querySelector(s);const r=n.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height}};const h=document.querySelector('[data-home-title]');return{width:innerWidth,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,h1Count:document.querySelectorAll('h1').length,h2Count:document.querySelectorAll('h2').length,href:document.querySelector('a.primary-action')?.getAttribute('href'),heroImage:rect('.home-hero__image'),title:rect('[data-home-title]'),intro:rect('[data-home-intro]'),gallery:rect('[data-gallery-content]'),footer:rect('[data-home-footer] footer'),pseudoDisplay:getComputedStyle(h,'::before').display}})()`});
            results.push(out.result.value);
          }
          const errors=[];const near=(a,b,t=2)=>Math.abs(a-b)<=t;
          for(const r of results){if(r.overflow>1)errors.push(`${r.width}px overflow=${r.overflow}`);if(r.h1Count!==1||r.h2Count!==2)errors.push(`${r.width}px headings=${r.h1Count}/${r.h2Count}`);if(r.href!=='/location/')errors.push(`${r.width}px href=${r.href}`);if(r.pseudoDisplay!=='none')errors.push(`${r.width}px split-title overlay still displayed`)}
          const m=results.find(r=>r.width===375);if(!m)errors.push('missing 375');else{if(!near(m.heroImage.width,375)||!near(m.heroImage.height,240))errors.push(`375 hero image ${JSON.stringify(m.heroImage)}`);if(!near(m.title.x,16)||!near(m.intro.width,343))errors.push(`375 title/intro ${JSON.stringify(m.title)} ${JSON.stringify(m.intro)}`);if(!near(m.gallery.width,343))errors.push(`375 gallery=${m.gallery.width}`);if(!near(m.footer.width,375))errors.push(`375 footer=${m.footer.width}`)}
          const x=results.find(r=>r.width===480);if(!x)errors.push('missing 480');else{if(!near(x.heroImage.width,480)||!near(x.heroImage.height,307.2,3))errors.push(`480 hero image ${JSON.stringify(x.heroImage)}`);if(!near(x.title.x,16)||!near(x.intro.width,448)||!near(x.gallery.width,448))errors.push(`480 content ${JSON.stringify(x.title)} ${JSON.stringify(x.intro)} ${JSON.stringify(x.gallery)}`)}
          console.log(JSON.stringify(results,null,2));ws.close();if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          NODE
