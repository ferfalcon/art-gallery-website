name: Agent P01-T02 Start

on:
  push:
    branches: [agent/p01-t01-visual-foundation]

permissions:
  contents: write

jobs:
  start:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start task and retrieve frontend guidance
        run: |
          set -euo pipefail
          corepack enable
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI context --json
          $CLI task start P01-T02
          $CLI sync
          $CLI context --json
          npx -y modern-web-guidance@latest search "Accessible Astro anchor button component hover focus-visible states responsive semantic footer decorative social icons no client JavaScript" --skill-version 2026_05_16-c5e78707 | tee /tmp/guidance.json
          IDS=$(node --input-type=module -e "import fs from 'node:fs'; const rows=JSON.parse(fs.readFileSync('/tmp/guidance.json','utf8')); console.log(rows.slice(0,3).map((row)=>row.id).join(','));")
          if [ -n "$IDS" ]; then npx -y modern-web-guidance@latest retrieve "$IDS"; fi
          git rm .github/workflows/agent-p01-t02-start.yml
          git add .workflow
          git commit -m "chore: start P01-T02"
          git push origin HEAD:agent/p01-t01-visual-foundation
