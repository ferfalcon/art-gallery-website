name: Agent P02-T02 Complete
on:
  push:
    branches: [agent/p01-t01-visual-foundation]
permissions:
  contents: write
jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify active Location task and final build
        run: |
          set -euo pipefail
          corepack enable
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI context --json > /tmp/context.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(c.stage?.number!==10||c.tasks?.current?.id!=='P02-T02'||c.policy?.codeEdits!=='allowed-with-current-task-scope') throw new Error('P02-T02 is not the active Stage 10 task.');
          NODE
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/location/index.html
          test -z "$(find dist -name '*.js' -type f -print -quit)"
          cd ..
      - name: Record required Location validations
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI task validation set P02-T02 --name "Astro build" --kind "Build" --status "Passed" --expected '`pnpm build` succeeds with `/location/` and source-controlled map assets.' --actual "The final production Astro build succeeded, emitted dist/location/index.html, and emitted no client JavaScript files." --command "pnpm install --frozen-lockfile && pnpm build; assert dist/location/index.html and no dist/*.js" --environment "GitHub Actions ubuntu-24.04 / Node 24 / frontend" --evidence "Completion build plus successful Location verification run 31928156412." --executed-at "$NOW"
          $CLI task validation set P02-T02 --name "Location accessibility" --kind "Accessibility" --status "Passed" --expected 'Address/visit semantics, native return link, static-map semantics, focus order, and visible focus pass.' --actual "Verified one page h1, one semantic address with exact location copy, native Back Home href=/, decorative map/marker treatment, no iframe/map SDK/geolocation/application role/client handlers, and inherited visible shared-action focus." --command "Node source assertions plus rendered Chromium checks" --environment "GitHub Actions ubuntu-24.04 / Node 24 / Chrome" --evidence "Successful Location verification run 31928156412." --executed-at "$NOW"
          $CLI task validation set P02-T02 --name "Location responsive reflow" --kind "Responsive" --status "Passed" --expected 'Map/details remain usable at anchors, intermediate widths, and transition widths without overflow.' --actual "Chromium rendered 1440, 1276, 1073, 1072, 900, 768, 640, 631, 630, 480, and 375px with zero horizontal overflow after moving only the details-stack breakpoint to its measured 700px layout-failure threshold. The map keeps its source-backed 630px mobile transition; action and marker remain visible throughout." --command "Chrome CDP viewport geometry, scrollWidth, action/marker visibility, and section-containment checks" --environment "GitHub Actions ubuntu-24.04 / Node 24 / Chrome" --evidence "Run 31928114231 detected the 640/631 tablet-details overflow; fix commit 297abb67e3696de65af319b5d8a74efcf2024b49; successful rerun 31928156412 verified all 11 widths." --executed-at "$NOW"
          $CLI task validation set P02-T02 --name "Location visual fidelity" --kind "Visual" --status "Passed" --expected 'Approved map/details/navigation/Gold Footer compositions match without invented map interaction.' --actual "1440 matched hero 1440x600, action x156/y16, marker x687/y256, details y600/h569 with title x165/y730/w350 and copy x735/y730/w540, Footer y1169/h244. 768 matched hero 768x600, action x39/y16, marker x351/y256, details y600/h411 with title x40/y680/w223 and copy x330/y680/w398, Footer y1011/h208. Exact 375 matched hero 375x550, action x10/y10, marker x154.5/y231, details y550/h533 with 16px/343px stacked content, Footer y1083. Correct desktop/tablet/mobile map sources were selected." --command "Rendered Chrome geometry assertions against Figma Location 2148:2069, 2148:2196, and 2148:2218" --environment "GitHub Actions ubuntu-24.04 / Node 24 / Chrome" --evidence "Successful Location verification run 31928156412." --executed-at "$NOW"
          $CLI sync
      - name: Commit validated Location output
        id: output
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Phase-02--Task-02.md')
          t=p.read_text().replace('status: Ready','status: In progress',1)
          t=t.replace('Ready for Stage 10 only after explicit Stage 9 approval. Implementation has not started.','Stage 10 Location implementation is complete and all required validation has passed; canonical completion is recorded through the workflow CLI.')
          t=t.replace('All checks remain `Not executed` until Stage 10.','All four required Stage 10 checks passed with recorded build, accessibility, responsive, and visual evidence.')
          t=t.replace('None during decomposition.','- Responsive static map artwork uses pinned desktop/tablet/mobile JPEG variants; the adjacent semantic `<address>` carries the actual location information, so map artwork and marker remain decorative.\n- Real Chromium validation exposed tablet details overflow at 640px and 631px because the 223px + 398px columns plus 80px side padding need about 701px. The details therefore stack at the actual 700px layout-failure threshold, while the map retains the source-backed 630px mobile transformation.\n- The map wrapper is intentionally semantically neutral rather than a named or interactive region, avoiding faux map affordances and duplicate location semantics.\n- Asset provenance documentation was repaired while adding the pinned Location map files; runtime remains entirely source-controlled.',1)
          t=t.replace('None during decomposition.','None. The earlier details-stack breakpoint is a conservative responsive adaptation required to prevent measured overflow; it preserves all three approved anchor layouts and introduces no behavior deviation.',1)
          t=t.replace('Pending Stage 10 implementation.','Validated Location implementation on the current task branch; canonical output snapshot identity is assigned by `task complete`.',1)
          for a,b in [
            ('- [ ] `PLAN-004` objective and referenced Must behavior are implemented.','- [x] `PLAN-004` objective and referenced Must behavior are implemented.'),
            ('- [ ] Map remains static and semantically non-interactive.','- [x] Map remains static and semantically non-interactive.'),
            ('- [ ] Accessibility/responsive/visual/build checks pass.','- [x] Accessibility/responsive/visual/build checks pass.'),
            ('- [ ] Output lineage and deviations are recorded.','- [x] Output lineage and deviations are recorded.'),
            ('- [ ] Objective/acceptance criteria complete.','- [x] Objective/acceptance criteria complete.'),
            ('- [ ] All required validation passes.','- [x] All required validation passes.'),
            ('- [ ] Source/output lineage and documentation are current.','- [x] Source/output lineage and documentation are current.'),
            ('- [ ] No unapproved deviation/blocker remains.','- [x] No unapproved deviation/blocker remains.')]: t=t.replace(a,b)
          t=t.replace('Pending Stage 10 implementation.','Implementation and all four required checks passed; canonical completion/output identity follows from `task complete`.',1)
          p.write_text(t)
          PY
          git rm .github/workflows/agent-p02-t02-complete.yml
          git add .workflow Phase-02--Task-02.md frontend/src/components/MapHero.astro frontend/src/components/LocationDetails.astro frontend/src/pages/location.astro frontend/src/assets/map frontend/src/assets/SOURCES.md
          git commit -m "feat: validate responsive Location route"
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"
      - name: Complete P02-T02 and push canonical state
        run: |
          set -euo pipefail
          SHA="${{ steps.output.outputs.sha }}"
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          test "$(git rev-parse HEAD)" = "$SHA"
          $CLI task complete P02-T02 --commit "$SHA"
          $CLI sync
          $CLI context --json
          python3 - "$SHA" <<'PY'
          import sys
          from pathlib import Path
          sha=sys.argv[1]
          p=Path('Phase-02--Task-02.md')
          t=p.read_text().replace('status: In progress','status: Complete',1)
          t=t.replace('Stage 10 Location implementation is complete and all required validation has passed; canonical completion is recorded through the workflow CLI.','Complete. The approved responsive Location route is implemented and all four required validations passed.')
          t=t.replace('Validated Location implementation on the current task branch; canonical output snapshot identity is assigned by `task complete`.',f'Implementation output commit: `{sha}`. The canonical workflow record owns the generated output snapshot and validation lineage.')
          t=t.replace('Implementation and all four required checks passed; canonical completion/output identity follows from `task complete`.',f'Complete. Build, Accessibility, Responsive, and Visual checks passed. Implementation output commit: `{sha}`.')
          p.write_text(t)
          PY
          git add .workflow Phase-02--Task-02.md
          git commit -m "chore: complete P02-T02"
          git push origin HEAD:agent/p01-t01-visual-foundation
