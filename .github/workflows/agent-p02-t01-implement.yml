name: Agent P02-T01 Implement

on:
  push:
    branches: [agent/p01-t01-visual-foundation]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify canonical Home task scope
        run: |
          set -euo pipefail
          corepack enable
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node docs/implementation-workflow/cli/design-workflow.mjs context --json > /tmp/context.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c = JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if (c.stage?.number !== 10) throw new Error(`Expected Stage 10, got ${c.stage?.number ?? 'none'}`);
          if (c.tasks?.current?.id !== 'P02-T01') throw new Error(`Expected P02-T01, got ${c.tasks?.current?.id ?? 'none'}`);
          if (c.sources?.latestOutput !== 'SRC-REPO-004') throw new Error(`Expected predecessor SRC-REPO-004, got ${c.sources?.latestOutput ?? 'none'}`);
          if (c.policy?.codeEdits !== 'allowed-with-current-task-scope') throw new Error('Home code edits are not authorized.');
          NODE

      - name: Implement responsive Home hero
        run: |
          cat > frontend/src/components/HomeHero.astro <<'EOF'
          ---
          import PrimaryAction from "./PrimaryAction.astro";
          import heroDesktop from "../assets/gallery/desktop/hero.jpg";
          import heroTablet from "../assets/gallery/tablet/hero.jpg";
          import heroMobile from "../assets/gallery/mobile/hero.jpg";
          ---

          <section class="home-hero" aria-labelledby="home-title" data-home-hero>
            <picture class="home-hero__image" aria-hidden="true">
              <source media="(max-width: 39.375rem)" srcset={heroMobile.src} />
              <source media="(max-width: 67rem)" srcset={heroTablet.src} />
              <img
                src={heroDesktop.src}
                alt=""
                width={heroDesktop.width}
                height={heroDesktop.height}
                fetchpriority="high"
                decoding="async"
              />
            </picture>

            <div class="home-hero__content">
              <h1 id="home-title" class="home-hero__title" data-home-title>
                <span>Modern</span>
                <span>Art Gallery</span>
              </h1>

              <div class="home-hero__intro" data-home-intro>
                <p>
                  The arts in the collection of the Modern Art Gallery all started from a spark of inspiration. Will these pieces inspire you? Visit us and find out.
                </p>
                <PrimaryAction href="/location/" label="Our Location" direction="forward" />
              </div>
            </div>
          </section>

          <style>
            .home-hero {
              position: relative;
              inline-size: min(100%, 90rem);
              block-size: clamp(43.75rem, 55.5556vi, 50rem);
              background: var(--color-surface);
            }

            .home-hero::before {
              position: absolute;
              z-index: 0;
              inset: 0 auto 0 0;
              inline-size: 31.2717%;
              background: var(--color-text-strong);
              content: "";
            }

            .home-hero__image {
              position: absolute;
              z-index: 1;
              inset-block: 0;
              inset-inline-start: 31.3194%;
              display: block;
              inline-size: 37.526%;
              block-size: 100%;
            }

            .home-hero__image img {
              inline-size: 100%;
              block-size: 100%;
              object-fit: cover;
            }

            .home-hero__content {
              position: absolute;
              z-index: 2;
              inset: 0;
            }

            .home-hero__title {
              position: absolute;
              inset-block-start: 23.625%;
              inset-inline-start: 11.4663%;
              inline-size: 35.72%;
              color: var(--color-text-strong);
              font-size: clamp(4.375rem, 6.6667vi, 6rem);
              line-height: var(--leading-hero);
              text-transform: uppercase;
            }

            .home-hero__title::before {
              position: absolute;
              inset: 0;
              clip-path: inset(0 44.5% 0 0);
              color: var(--color-surface);
              content: "MODERN\A ART GALLERY";
              white-space: pre;
            }

            .home-hero__title span {
              display: block;
            }

            .home-hero__intro {
              position: absolute;
              inset-block-start: 31.875%;
              inset-inline-start: 64.2361%;
              display: flex;
              inline-size: 24.3056%;
              min-inline-size: 0;
              flex-direction: column;
              align-items: flex-start;
              gap: var(--space-800);
              font-size: var(--type-body-large);
              line-height: var(--leading-body);
            }

            @media (max-width: 67rem) {
              .home-hero {
                block-size: 43.75rem;
              }

              .home-hero::before {
                display: none;
              }

              .home-hero__image {
                position: absolute;
                inset-inline-start: 0;
                inline-size: 56.901%;
                block-size: 43.75rem;
              }

              .home-hero__content {
                inset: 50% auto auto 50.651%;
                display: flex;
                inline-size: 44.1406%;
                min-inline-size: 0;
                flex-direction: column;
                gap: var(--space-600);
                transform: translateY(-50%);
              }

              .home-hero__title {
                position: static;
                inline-size: 100%;
                font-size: 4.375rem;
              }

              .home-hero__title::before {
                display: none;
              }

              .home-hero__intro {
                position: static;
                display: flex;
                inline-size: 100%;
                flex-direction: column;
                gap: var(--space-600);
                font-size: var(--type-body-medium);
              }
            }

            @media (max-width: 39.375rem) {
              .home-hero {
                display: flex;
                block-size: auto;
                flex-direction: column;
                align-items: center;
                gap: var(--space-400);
              }

              .home-hero__image {
                position: relative;
                inset: auto;
                inline-size: 100%;
                block-size: auto;
                aspect-ratio: 375 / 240;
              }

              .home-hero__content {
                position: relative;
                inset: auto;
                inline-size: calc(100% - 2rem);
                flex: none;
                gap: var(--space-400);
                transform: none;
              }

              .home-hero__title {
                font-size: 3.75rem;
              }

              .home-hero__intro {
                gap: var(--space-400);
              }
            }
          </style>
          EOF

      - name: Implement responsive editorial gallery
        run: |
          cat > frontend/src/components/GalleryContent.astro <<'EOF'
          ---
          import dayDesktop from "../assets/gallery/desktop/grid-day.jpg";
          import dayTablet from "../assets/gallery/tablet/grid-day.jpg";
          import dayMobile from "../assets/gallery/mobile/grid-day.jpg";
          import tallDesktop from "../assets/gallery/desktop/grid-tall.jpg";
          import tallTablet from "../assets/gallery/tablet/grid-tall.jpg";
          import tallMobile from "../assets/gallery/mobile/grid-tall.jpg";
          import inspirationDesktop from "../assets/gallery/desktop/grid-inspiration.jpg";
          import inspirationTablet from "../assets/gallery/tablet/grid-inspiration.jpg";
          import inspirationMobile from "../assets/gallery/mobile/grid-inspiration.jpg";
          ---

          <div class="gallery-content" data-gallery-content>
            <section class="gallery-content__day" aria-labelledby="gallery-day-title">
              <div class="gallery-content__day-copy">
                <h2 id="gallery-day-title">Your Day at the Gallery</h2>
                <p>
                  Wander through our distinct collections and find new insights about our artists. Dive into the details of their creative process.
                </p>
              </div>

              <picture class="gallery-content__day-image" aria-hidden="true">
                <source media="(max-width: 39.375rem)" srcset={dayMobile.src} />
                <source media="(max-width: 67rem)" srcset={dayTablet.src} />
                <img src={dayDesktop.src} alt="" width={dayDesktop.width} height={dayDesktop.height} loading="lazy" decoding="async" />
              </picture>
            </section>

            <section class="gallery-content__inspiration" aria-labelledby="gallery-inspiration-title">
              <picture class="gallery-content__tall-image" aria-hidden="true">
                <source media="(max-width: 39.375rem)" srcset={tallMobile.src} />
                <source media="(max-width: 67rem)" srcset={tallTablet.src} />
                <img src={tallDesktop.src} alt="" width={tallDesktop.width} height={tallDesktop.height} loading="lazy" decoding="async" />
              </picture>

              <div class="gallery-content__inspiration-column">
                <picture class="gallery-content__inspiration-image" aria-hidden="true">
                  <source media="(max-width: 39.375rem)" srcset={inspirationMobile.src} />
                  <source media="(max-width: 67rem)" srcset={inspirationTablet.src} />
                  <img src={inspirationDesktop.src} alt="" width={inspirationDesktop.width} height={inspirationDesktop.height} loading="lazy" decoding="async" />
                </picture>

                <div class="gallery-content__inspiration-copy">
                  <h2 id="gallery-inspiration-title">Come &amp; Be Inspired</h2>
                  <p>We’re excited to welcome you to our gallery and see how our collections influence you.</p>
                </div>
              </div>
            </section>
          </div>

          <style>
            .gallery-content {
              display: flex;
              inline-size: min(calc(100% - 2rem), 69.375rem);
              flex-direction: column;
              gap: var(--space-400);
            }

            .gallery-content__day,
            .gallery-content__inspiration {
              display: grid;
              inline-size: 100%;
              align-items: center;
              justify-content: space-between;
            }

            .gallery-content__day {
              grid-template-columns: minmax(0, 21.875rem) minmax(0, 39.6875rem);
            }

            .gallery-content__day-copy {
              display: flex;
              min-inline-size: 0;
              flex-direction: column;
              gap: var(--space-400);
            }

            .gallery-content h2 {
              font-size: var(--type-section-large);
              line-height: var(--leading-display);
              text-transform: uppercase;
            }

            .gallery-content p {
              font-size: var(--type-body-large);
              line-height: var(--leading-body);
            }

            .gallery-content picture,
            .gallery-content img {
              display: block;
              inline-size: 100%;
              block-size: 100%;
            }

            .gallery-content img {
              object-fit: cover;
            }

            .gallery-content__day-image {
              inline-size: 39.6875rem;
              block-size: 25rem;
            }

            .gallery-content__inspiration {
              grid-template-columns: minmax(0, 39.6875rem) minmax(0, 27.8125rem);
            }

            .gallery-content__tall-image {
              inline-size: 39.6875rem;
              block-size: 45rem;
            }

            .gallery-content__inspiration-column {
              display: flex;
              inline-size: 27.8125rem;
              min-inline-size: 0;
              flex-direction: column;
              gap: var(--space-400);
            }

            .gallery-content__inspiration-image {
              inline-size: 100%;
              block-size: 19.5625rem;
            }

            .gallery-content__inspiration-copy {
              display: flex;
              inline-size: 100%;
              block-size: 23.5625rem;
              flex-direction: column;
              justify-content: center;
              gap: var(--space-400);
              padding: var(--space-800) var(--space-600);
              color: var(--color-surface);
              background: var(--color-text-strong);
            }

            .gallery-content__inspiration-copy h2 {
              color: inherit;
            }

            @media (max-width: 67rem) {
              .gallery-content {
                inline-size: min(89.7135%, 62.5rem);
                gap: var(--space-150);
              }

              .gallery-content__day {
                grid-template-columns: 32.3657% 57.7649%;
              }

              .gallery-content__day-copy {
                gap: var(--space-300);
              }

              .gallery-content h2 {
                font-size: 3.125rem;
                line-height: var(--leading-hero);
              }

              .gallery-content p {
                font-size: var(--type-body-medium);
              }

              .gallery-content__day-image {
                inline-size: 100%;
                block-size: 25rem;
              }

              .gallery-content__inspiration {
                grid-template-columns: 57.7649% 40.6386%;
              }

              .gallery-content__tall-image {
                inline-size: 100%;
                block-size: 45rem;
              }

              .gallery-content__inspiration-column {
                inline-size: 100%;
                gap: var(--space-150);
              }

              .gallery-content__inspiration-image {
                block-size: 19.5625rem;
              }

              .gallery-content__inspiration-copy {
                block-size: 24.75rem;
                gap: var(--space-300);
                padding: var(--space-1000) var(--space-400);
              }
            }

            @media (max-width: 39.375rem) {
              .gallery-content {
                inline-size: calc(100% - 2rem);
                gap: var(--space-400);
              }

              .gallery-content__day,
              .gallery-content__inspiration {
                display: flex;
                flex-direction: column;
                align-items: stretch;
              }

              .gallery-content__day {
                gap: var(--space-300);
              }

              .gallery-content__day-image {
                order: -1;
                block-size: auto;
                aspect-ratio: 343 / 320;
              }

              .gallery-content__day-copy {
                gap: var(--space-300);
              }

              .gallery-content__inspiration {
                gap: var(--space-200);
              }

              .gallery-content__tall-image {
                block-size: auto;
                aspect-ratio: 343 / 480;
              }

              .gallery-content__inspiration-column {
                gap: var(--space-200);
              }

              .gallery-content__inspiration-image {
                block-size: auto;
                aspect-ratio: 343 / 200;
              }

              .gallery-content__inspiration-copy {
                block-size: auto;
                gap: var(--space-300);
                padding: var(--space-600) var(--space-300);
              }
            }
          </style>
          EOF

      - name: Compose the Home route
        run: |
          cat > frontend/src/pages/index.astro <<'EOF'
          ---
          import Layout from "../layouts/Layout.astro";
          import HomeHero from "../components/HomeHero.astro";
          import GalleryContent from "../components/GalleryContent.astro";
          import Footer from "../components/Footer.astro";
          ---

          <Layout
            title="Modern Art Gallery"
            description="Discover the Modern Art Gallery collection and plan a visit to 99 King Street, Newport."
          >
            <main class="home-main" data-home-main>
              <HomeHero />
              <GalleryContent />
            </main>
            <div class="home-footer" data-home-footer>
              <Footer theme="dark" />
            </div>
          </Layout>

          <style>
            .home-main {
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 11.25rem;
            }

            .home-footer {
              margin-block-start: 11.25rem;
            }

            @media (max-width: 67rem) {
              .home-main {
                gap: 7.5rem;
              }

              .home-footer {
                margin-block-start: 7.5rem;
              }
            }

            @media (max-width: 39.375rem) {
              .home-main {
                gap: 6.25rem;
              }

              .home-footer {
                margin-block-start: 6.25rem;
              }
            }
          </style>
          EOF

      - name: Build Home route
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/index.html
          test -z "$(find dist -name '*.js' -type f -print -quit)"

      - name: Validate Home source semantics and design anchors
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const hero = fs.readFileSync('frontend/src/components/HomeHero.astro','utf8');
          const gallery = fs.readFileSync('frontend/src/components/GalleryContent.astro','utf8');
          const page = fs.readFileSync('frontend/src/pages/index.astro','utf8');
          const errors = [];
          const check = (ok, message) => { if (!ok) errors.push(message); };

          check((hero.match(/<h1\b/g) ?? []).length === 1, 'HomeHero must contain exactly one h1.');
          check(hero.includes('href="/location/"') && hero.includes('label="Our Location"') && hero.includes('direction="forward"'), 'Home must use the explicit shared /location/ action contract.');
          check(!/client:|onclick|on:click/.test(hero + gallery + page), 'Home route must remain static with no hydration/client handlers.');
          check(hero.includes('content: "MODERN\\A ART GALLERY"') && hero.includes('clip-path: inset(0 44.5% 0 0)'), 'Desktop split title must use one semantic h1 plus decorative clipped generated text.');
          check(hero.includes('inline-size: 31.2717%') && hero.includes('inset-inline-start: 31.3194%') && hero.includes('inline-size: 37.526%'), 'Desktop hero field/image anchors are missing.');
          check(hero.includes('inset-inline-start: 64.2361%') && hero.includes('inline-size: 24.3056%'), 'Desktop intro anchors are missing.');
          check(hero.includes('block-size: 43.75rem') && hero.includes('inline-size: 56.901%') && hero.includes('inset: 50% auto auto 50.651%'), 'Tablet hero anchors are missing.');
          check(hero.includes('aspect-ratio: 375 / 240') && hero.includes('font-size: 3.75rem'), 'Mobile hero transformation is missing.');
          check((hero.match(/<source\b/g) ?? []).length === 2 && hero.includes('fetchpriority="high"') && !hero.includes('loading="lazy"'), 'Hero must use art direction and prioritize the LCP image.');

          check((gallery.match(/<h2\b/g) ?? []).length === 2, 'Gallery content must preserve two h2 sections.');
          check((gallery.match(/alt=""/g) ?? []).length === 3 && (gallery.match(/aria-hidden="true"/g) ?? []).length === 3, 'Decorative gallery images must be consistently hidden from assistive technology.');
          check((gallery.match(/loading="lazy"/g) ?? []).length === 3, 'All below-the-fold gallery images must lazy-load.');
          check(gallery.includes('69.375rem') && gallery.includes('39.6875rem') && gallery.includes('27.8125rem'), 'Desktop 1110/635/445 gallery anchors are missing.');
          check(gallery.includes('inline-size: min(89.7135%, 62.5rem)') && gallery.includes('grid-template-columns: 32.3657% 57.7649%') && gallery.includes('grid-template-columns: 57.7649% 40.6386%'), 'Tablet 689/223/398/280 gallery relationships are missing.');
          check(gallery.includes('aspect-ratio: 343 / 320') && gallery.includes('aspect-ratio: 343 / 480') && gallery.includes('aspect-ratio: 343 / 200'), 'Mobile gallery art-direction ratios are missing.');
          check(page.includes('<main class="home-main"') && page.includes('<Footer theme="dark"'), 'Home page must own main and compose the Dark Footer.');
          check(page.includes('gap: 11.25rem') && page.includes('gap: 7.5rem') && page.includes('gap: 6.25rem'), 'Home 180/120/100 vertical rhythm anchors are missing.');
          check(!/overflow-x\s*:\s*hidden/i.test(hero + gallery + page), 'Horizontal overflow must be solved, never hidden.');

          if (errors.length) { console.error(errors.join('\n')); process.exit(1); }
          console.log('Home source semantics and Figma-anchor assertions passed.');
          NODE

      - name: Validate rendered Home at anchor and transition widths
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-family browser available on runner." >&2
            exit 1
          fi
          python3 -m http.server 4321 --directory frontend/dist >/tmp/home-server.log 2>&1 &
          SERVER_PID=$!
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/home-chrome about:blank >/tmp/home-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $SERVER_PID $CHROME_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 0.2
          done

          cat > /tmp/validate-home.mjs <<'NODE'
          const targets = await (await fetch('http://127.0.0.1:9222/json')).json();
          const pageTarget = targets.find((target) => target.type === 'page');
          if (!pageTarget?.webSocketDebuggerUrl) throw new Error('No Chromium page target found.');

          const socket = new WebSocket(pageTarget.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener('open', resolve, { once: true });
            socket.addEventListener('error', reject, { once: true });
          });

          let nextId = 0;
          const pending = new Map();
          socket.addEventListener('message', (event) => {
            const message = JSON.parse(event.data);
            if (!message.id) return;
            const entry = pending.get(message.id);
            if (!entry) return;
            pending.delete(message.id);
            if (message.error) entry.reject(new Error(message.error.message));
            else entry.resolve(message.result);
          });

          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = ++nextId;
            pending.set(id, { resolve, reject });
            socket.send(JSON.stringify({ id, method, params }));
          });

          await send('Page.enable');
          await send('Runtime.enable');

          const widths = [1440, 1276, 1072, 900, 768, 640, 630, 480, 375];
          const results = [];
          for (const width of widths) {
            await send('Emulation.setDeviceMetricsOverride', { width, height: 1000, deviceScaleFactor: 1, mobile: false });
            await send('Page.navigate', { url: 'http://127.0.0.1:4321/' });
            await new Promise((resolve) => setTimeout(resolve, 250));
            await send('Runtime.evaluate', {
              expression: `(async () => { if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, {once:true})); await document.fonts.ready; return true; })()`,
              awaitPromise: true,
              returnByValue: true,
            });
            const evaluated = await send('Runtime.evaluate', {
              expression: `(() => {
                const rect = (selector) => { const node = document.querySelector(selector); if (!node) return null; const r = node.getBoundingClientRect(); return { x:r.x, y:r.y, width:r.width, height:r.height }; };
                const html = document.documentElement;
                const h1 = document.querySelector('[data-home-title]');
                const pseudo = h1 ? getComputedStyle(h1, '::before') : null;
                return {
                  width: innerWidth,
                  overflow: html.scrollWidth - html.clientWidth,
                  h1Count: document.querySelectorAll('h1').length,
                  h2Count: document.querySelectorAll('h2').length,
                  actionHref: document.querySelector('a.primary-action')?.getAttribute('href'),
                  scripts: document.querySelectorAll('script[src]').length,
                  hero: rect('[data-home-hero]'),
                  heroImage: rect('.home-hero__image'),
                  title: rect('[data-home-title]'),
                  intro: rect('[data-home-intro]'),
                  gallery: rect('[data-gallery-content]'),
                  footer: rect('[data-home-footer] footer'),
                  titleColor: h1 ? getComputedStyle(h1).color : null,
                  pseudoContent: pseudo?.content,
                  pseudoColor: pseudo?.color,
                  pseudoClip: pseudo?.clipPath,
                };
              })()`,
              returnByValue: true,
            });
            results.push(evaluated.result.value);
          }

          const errors = [];
          const near = (actual, expected, tolerance = 1.5) => Math.abs(actual - expected) <= tolerance;
          for (const result of results) {
            if (result.overflow > 1) errors.push(`${result.width}px has ${result.overflow}px horizontal overflow.`);
            if (result.h1Count !== 1) errors.push(`${result.width}px expected one h1, got ${result.h1Count}.`);
            if (result.h2Count !== 2) errors.push(`${result.width}px expected two h2s, got ${result.h2Count}.`);
            if (result.actionHref !== '/location/') errors.push(`${result.width}px action href is ${result.actionHref}.`);
            if (result.scripts !== 0) errors.push(`${result.width}px unexpectedly ships ${result.scripts} external script(s).`);
          }

          const desktop = results.find((r) => r.width === 1440);
          if (!near(desktop.hero.height, 800) || !near(desktop.hero.width, 1440)) errors.push(`1440 hero is ${desktop.hero.width}x${desktop.hero.height}, expected 1440x800.`);
          if (!near(desktop.heroImage.x, 451, 2) || !near(desktop.heroImage.width, 540.375, 2) || !near(desktop.heroImage.height, 800)) errors.push(`1440 hero image bounds drifted: ${JSON.stringify(desktop.heroImage)}.`);
          if (!near(desktop.title.x, 165.1, 2) || !near(desktop.title.y, 189, 2)) errors.push(`1440 title anchor drifted: ${JSON.stringify(desktop.title)}.`);
          if (!near(desktop.intro.x, 925, 2) || !near(desktop.intro.y, 255, 2) || !near(desktop.intro.width, 350, 2)) errors.push(`1440 intro anchor drifted: ${JSON.stringify(desktop.intro)}.`);
          if (!near(desktop.gallery.x, 165, 2) || !near(desktop.gallery.y, 980, 2) || !near(desktop.gallery.width, 1110, 2)) errors.push(`1440 gallery anchor drifted: ${JSON.stringify(desktop.gallery)}.`);
          if (desktop.pseudoContent === 'none' || desktop.pseudoClip === 'none') errors.push('1440 split title overlay is not active.');

          const tablet = results.find((r) => r.width === 768);
          if (!near(tablet.hero.height, 700) || !near(tablet.heroImage.width, 437, 2) || !near(tablet.heroImage.height, 700)) errors.push(`768 hero/image bounds drifted: ${JSON.stringify(tablet.hero)} / ${JSON.stringify(tablet.heroImage)}.`);
          if (!near(tablet.intro.width, 339, 2)) errors.push(`768 intro width drifted: ${tablet.intro.width}.`);
          if (!near(tablet.gallery.width, 689, 2) || !near(tablet.gallery.y, 820, 3)) errors.push(`768 gallery anchor drifted: ${JSON.stringify(tablet.gallery)}.`);
          if (tablet.pseudoContent !== 'none') errors.push('768 must disable the desktop split-title overlay.');

          const mobile = results.find((r) => r.width === 375);
          if (!near(mobile.heroImage.width, 375) || !near(mobile.heroImage.height, 240, 2)) errors.push(`375 hero image drifted: ${JSON.stringify(mobile.heroImage)}.`);
          if (!near(mobile.title.x, 16, 2) || !near(mobile.intro.width, 343, 2)) errors.push(`375 title/intro drifted: ${JSON.stringify(mobile.title)} / ${JSON.stringify(mobile.intro)}.`);
          if (!near(mobile.gallery.width, 343, 2)) errors.push(`375 gallery width drifted: ${mobile.gallery.width}.`);
          if (!near(mobile.footer.width, 375, 2)) errors.push(`375 footer width drifted: ${mobile.footer.width}.`);

          console.log(JSON.stringify(results, null, 2));
          if (errors.length) {
            console.error(errors.join('\n'));
            process.exitCode = 1;
          }
          socket.close();
          NODE
