name: Agent P03-T01 Cleanup
on:
  push:
    branches: [agent/p01-t01-visual-foundation]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove starter subgraph is unreachable from live source
        run: |
          set -euo pipefail
          corepack enable
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node docs/implementation-workflow/cli/design-workflow.mjs context --json > /tmp/context.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(c.stage?.number!==10||c.tasks?.current?.id!=='P03-T01'||c.policy?.codeEdits!=='allowed-with-current-task-scope') throw new Error('P03-T01 is not the active Stage 10 task.');
          NODE
          test -f frontend/src/components/Welcome.astro
          test -f frontend/src/assets/astro.svg
          test -f frontend/src/assets/background.svg

          echo "Proving Welcome.astro has no consumers outside the starter subgraph"
          if grep -R --line-number --fixed-string "Welcome.astro" frontend/src --exclude="Welcome.astro"; then
            echo "Unexpected live Welcome.astro consumer" >&2
            exit 1
          fi
          if grep -R --line-number -E "from ['\"]\.\.?/.*Welcome['\"]|import .*Welcome" frontend/src --exclude="Welcome.astro"; then
            echo "Unexpected live Welcome import" >&2
            exit 1
          fi

          echo "Proving starter assets are referenced nowhere except Welcome.astro"
          for asset in astro.svg background.svg; do
            refs="$(grep -R --line-number --fixed-string "$asset" frontend/src --exclude="$asset" || true)"
            if [ -n "$refs" ]; then
              echo "$refs"
              unexpected="$(printf '%s\n' "$refs" | grep -v '^frontend/src/components/Welcome.astro:' || true)"
              if [ -n "$unexpected" ]; then
                echo "Unexpected live reference to ${asset}:" >&2
                echo "$unexpected" >&2
                exit 1
              fi
            fi
          done
          echo "Starter subgraph is unreachable from live implementation."
      - name: Remove only confirmed-unused starter files and rebuild
        run: |
          set -euo pipefail
          git rm frontend/src/components/Welcome.astro frontend/src/assets/astro.svg frontend/src/assets/background.svg
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/index.html
          test -f dist/location/index.html
          cd ..
      - name: Persist reference-proven cleanup
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-p03-t01-cleanup.yml
          git add frontend/src
          git commit -m "chore: remove unused Astro starter residue"
          git push origin HEAD:agent/p01-t01-visual-foundation
